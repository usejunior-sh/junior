<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>Junior</title>
<!--
  A window's own page while its tabs show. The tab views lie over it, so it
  shows only while the front tab's page is still loading (tabs.ts keeps a
  view hidden until then): a quiet loader instead of a black window.

  It must declare an app region: Chromium sends a page's drag regions only
  when it has some, so a page with none (about:blank) leaves the splash's
  whole-window drag region in place, and every click in a tab would drag the
  window instead.
-->
<style>
  :root { --canvas: #0c0b0a; --ash: #8d8982; --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--canvas); }
  body {
    display: flex; align-items: center; justify-content: center;
    user-select: none; cursor: default; -webkit-app-region: no-drag;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    font: 12px var(--mono); color: var(--ash); -webkit-font-smoothing: antialiased;
    opacity: 0; animation: in 0.2s ease 0.3s forwards;
  }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--ash); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  /* a quick load never shows it */
  @keyframes in { to { opacity: 1; } }
</style>
</head>
<body>
  <div class="status" role="status"><span class="dot"></span><span>Opening workspace…</span></div>
</body>
</html>
